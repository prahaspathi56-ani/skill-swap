version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillswap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillswap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillswap_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-skillswap_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap_user -d skillswap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: skillswap_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://skillswap_user:skillswap_secure_password@postgres:5432/skillswap_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-skillswap_super_secure_jwt_production_secret_32chars}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:80
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: skillswap_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
